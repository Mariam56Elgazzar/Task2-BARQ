name: Test and release notes image

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: notes-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag and reviewed ancestry
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Use a vMAJOR.MINOR.PATCH tag'; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo 'Release commit must be merged into main'; exit 1; }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --requirement app/requirements-dev.txt
      - name: Test API against disposable PostgreSQL
        run: python -m pytest app/tests -q
      - name: Build image once
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 --file app/Dockerfile --tag notes-api:verified \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" .
      - name: Test the packaged image
        run: python scripts/verify-image.py notes-api:verified
      - name: Scan OS and Python packages
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: notes-api:verified
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: image-scan.json
      - name: Retain vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-scan
          path: image-scan.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save tested image for publication
        if: startsWith(github.ref, 'refs/tags/')
        run: docker save notes-api:verified --output notes-image.tar
      - name: Transfer tested image
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image
          path: notes-image.tar
          compression-level: 0
          retention-days: 1

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image
      - name: Publish the tested bytes and record their digest
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/release-docker"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_USER" --password-stdin
          image="ghcr.io/${IMAGE_OWNER,,}/notes-api"
          manifest_error="$RUNNER_TEMP/manifest-error.txt"
          if docker manifest inspect "$image:$RELEASE_TAG" >/dev/null 2>"$manifest_error"; then
            echo 'This version already exists. Use a new version instead of overwriting it.'
            exit 1
          fi
          error_text=$(cat "$manifest_error")
          if [[ "$error_text" == "no such manifest: $image:$RELEASE_TAG" ]]; then
            : # The package exists, but this version does not.
          elif [[ "$error_text" == *"https://ghcr.io/v2/${IMAGE_OWNER,,}/notes-api/manifests/$RELEASE_TAG"* && "$error_text" == *": denied" ]]; then
            # GHCR can say "denied" before a package exists. Confirm its absence
            # through GitHub Packages; all other responses fail closed.
            package_status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/users/$IMAGE_OWNER/packages/container/notes-api")
            if [[ "$package_status" != 404 ]]; then
              echo 'Cannot confirm that the image package is absent. Check registry access/connectivity and retry.'
              exit 1
            fi
          else
            echo 'Cannot confirm that this version is absent. Check registry access/connectivity and retry.'
            exit 1
          fi
          docker load --input notes-image.tar
          docker tag notes-api:verified "$image:$RELEASE_TAG"
          docker tag notes-api:verified "$image:sha-$SOURCE_SHA"
          docker push "$image:$RELEASE_TAG"
          docker push "$image:sha-$SOURCE_SHA"
          pinned=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$RELEASE_TAG")
          [[ "$pinned" == "$image@sha256:"* ]] || { echo 'Missing image digest'; exit 1; }
          echo "image=$pinned" >> "$GITHUB_OUTPUT"
          printf '### Published image\n\nVersion: `%s:%s`\n\nDeploy: `%s`\n' "$image" "$RELEASE_TAG" "$pinned" >> "$GITHUB_STEP_SUMMARY"

  verify-pull:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: read
    steps:
      - name: Pull by digest on a fresh runner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/pull-docker"
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GH_USER" --password-stdin
          docker pull "$IMAGE"
          test "$(docker run --rm --entrypoint id "$IMAGE" -u)" = 10001
          printf 'Fresh-runner authenticated pull passed: `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
