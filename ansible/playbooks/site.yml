---
- name: Wait for SSH on all hosts
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait until the host accepts SSH connections
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300

- name: Install Docker on all hosts
  hosts: all
  become: true
  roles:
    - docker

- name: Render protected stack environments
  hosts: app:db
  become: true
  roles:
    - deployment_secrets

# Database runs after Docker and protected credentials, before the app.
- name: Deploy PostgreSQL on the database host
  hosts: db
  become: true
  roles:
    - postgres

