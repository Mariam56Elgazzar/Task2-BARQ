---
- name: Wait for SSH on all hosts
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait until the host accepts SSH connections
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300

- name: Install Docker on all hosts
  hosts: all
  become: true
  roles:
    - docker

- name: Render protected stack environments
  hosts: app:db
  become: true
  roles:
    - deployment_secrets

- name: Deploy PostgreSQL and backups
  hosts: db
  become: true
  roles:
    - postgres
    - db_backup

- name: Wait for PostgreSQL from application host
  hosts: app
  become: true
  tasks:
    - name: Wait for PostgreSQL private listener
      ansible.builtin.wait_for:
        host: "{{ db_private_ip }}"
        port: "{{ db_port }}"
        timeout: 120

- name: Deploy application stack
  hosts: app
  become: true
  roles:
    - app_stack
