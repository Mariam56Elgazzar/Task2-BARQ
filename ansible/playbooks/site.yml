---
- name: Wait for SSH on all hosts
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait until the host accepts SSH connections
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300

- name: Install Docker on all hosts
  hosts: all
  become: true
  roles:
    - docker

